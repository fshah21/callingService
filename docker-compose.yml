services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callservice
      POSTGRES_PASSWORD: callservice
      POSTGRES_DB: callservice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callservice -d callservice"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-off: applies migrations/*.sql (tracked in a schema_migrations table) then exits.
  # api/worker wait for this to finish successfully before starting.
  migrate:
    build: .
    command: ["node", "scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://callservice:callservice@postgres:5432/callservice
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["node", "src/index.js"]
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://callservice:callservice@postgres:5432/callservice
      PERSIST_INTERVAL_MS: ${PERSIST_INTERVAL_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CALL_QUEUED_TO_RINGING_MS_MIN: ${CALL_QUEUED_TO_RINGING_MS_MIN:-500}
      CALL_QUEUED_TO_RINGING_MS_MAX: ${CALL_QUEUED_TO_RINGING_MS_MAX:-2000}
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "src/queue/worker.js"]
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://callservice:callservice@postgres:5432/callservice
      PERSIST_INTERVAL_MS: ${PERSIST_INTERVAL_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CALL_QUEUED_TO_RINGING_MS_MIN: ${CALL_QUEUED_TO_RINGING_MS_MIN:-500}
      CALL_QUEUED_TO_RINGING_MS_MAX: ${CALL_QUEUED_TO_RINGING_MS_MAX:-2000}
      CALL_RINGING_MS_MIN: ${CALL_RINGING_MS_MIN:-2000}
      CALL_RINGING_MS_MAX: ${CALL_RINGING_MS_MAX:-6000}
      CALL_ANSWERED_DURATION_MS_MIN: ${CALL_ANSWERED_DURATION_MS_MIN:-5000}
      CALL_ANSWERED_DURATION_MS_MAX: ${CALL_ANSWERED_DURATION_MS_MAX:-30000}
      CALL_UNANSWERED_TO_COMPLETED_MS_MIN: ${CALL_UNANSWERED_TO_COMPLETED_MS_MIN:-500}
      CALL_UNANSWERED_TO_COMPLETED_MS_MAX: ${CALL_UNANSWERED_TO_COMPLETED_MS_MAX:-1500}
      CALL_ANSWER_PROBABILITY: ${CALL_ANSWER_PROBABILITY:-0.7}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_BUCKET: call-recordings
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  minio-data:
